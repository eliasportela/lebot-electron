<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Lebot Desk</title>

    <style>
        :root {
            --bg-color: #0E6E61;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --accent: #1CC88A;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background-color: var(--bg-color);
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            overflow: hidden;
        }

        .splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .logo {
            width: 88px;
            user-select: none;
        }

        .app-name {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .loader {
            width: 160px;
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
            overflow: hidden;
            border-radius: 1px;
        }

        .loader::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            background: var(--accent);
            animation: loading 1.2s ease-in-out infinite;
        }

        .loading-text {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(250%);
            }
        }
    </style>
</head>

<body>
<div class="splash">
    <img src="./assets/logo.png" alt="Lebot Desk Logo" class="logo" />
    <div class="app-name">Lebot Desk</div>
    <div class="loader"></div>
    <div class="loading-text">Inicializando aplicação…</div>
</div>
</body>
</html>
