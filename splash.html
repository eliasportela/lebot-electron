<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>LeBot Desktop</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #101824;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #fff;
            font-family: "Segoe UI", sans-serif;
            overflow: hidden;
        }

        img {
            width: 110px;
            height: auto;
            margin-bottom: 25px;
            user-select: none;
        }

        .loading-text {
            font-size: 14px;
            opacity: 0.85;
            margin-top: 10px;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.15);
            border-top: 3px solid #00b4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<img src="./assets/logo.png" alt="LeBot Logo">
<div class="spinner"></div>
<div class="loading-text">Carregando LeBot...</div>
</body>
</html>
